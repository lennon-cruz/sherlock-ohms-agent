[project]
name = "sherlock-ohms-agent"
version = "0.1.0"
description = "A minimal agentic RAG assistant that routes questions to fintech or telecom market reports."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "chromadb>=0.5",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
ingest = "sherlock_ohms.ingest:main"
agent = "sherlock_ohms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock_ohms"]
